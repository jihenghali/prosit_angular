<h1>Liste des conférences</h1>
<input type="text" [(ngModel)]="searchItem" />
<div class="container" style="display: flex; flex-wrap: wrap; gap: 16px">
  @for (conf of filtrer(); track conf.id) {
    <app-card
      [conf]="conf"
      (favoriteRequested)="addToFavorite(conf)"
      (likeRequested)="liker(conf)"
    ></app-card>
  } @empty {
    <h2>Aucune conférence n'est disponible pour le moment</h2>
  }
</div>
<div>
  <h2>Liste des favoris</h2>
  <ul>
    @for (conf of favoriteList(); track conf.id) {
      <li>{{ conf.titre }}</li>
    }
  </ul>
</div>
